name: Push challenge to ML-Arena

on:
  push:
    branches: [main]
    # No path filter on purpose: GitHub skips a filtered workflow when a commit
    # changes more than 300 files. A commit that changes nothing the challenge
    # holds leaves it as it is.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and report, change nothing
        type: boolean
        default: true

permissions:
  id-token: write   # the job proves its identity to ML-Arena: no secret to store
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 test_local.py
      - uses: ml-arena/mlarena-action@v1
        with:
          command: challenge-push
          challenge: your-challenge-id   # the number in ml-arena.com/studio/challenges/<id>
          dry-run: ${{ inputs.dry_run || false }}
